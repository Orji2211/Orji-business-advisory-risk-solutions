backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "pages"
    label: "Website Pages"
    files:
      - label: "Homepage"
        name: "home"
        file: "content/pages/home.md"
        fields:
          - {label: "Hero Title", name: "hero_title", widget: "string"}
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "text"}
          - {label: "Main Section Title", name: "main_title", widget: "string"}
          - {label: "Main Section Text", name: "main_text", widget: "text"}
      - label: "About Founder"
        name: "about"
        file: "content/pages/about.md"
        fields:
          - {label: "Founder Name", name: "founder_name", widget: "string"}
          - {label: "Founder Title", name: "founder_title", widget: "string"}
          - {label: "Founder Bio", name: "body", widget: "markdown"}
      - label: "Contact Information"
        name: "contact"
        file: "content/pages/contact.md"
        fields:
          - {label: "Business Email", name: "email", widget: "string"}
          - {label: "Business Phone", name: "phone", widget: "string"}
          - {label: "LinkedIn", name: "linkedin", widget: "string", required: false}
          - {label: "Calendly Link", name: "calendly", widget: "string", required: false}

  - name: "services"
    label: "Services"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Service Name", name: "title", widget: "string"}
      - {label: "Description", name: "body", widget: "markdown"}

  - name: "posts"
    label: "Insights / Blog Posts"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Post Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Post Body", name: "body", widget: "markdown"}
